[package]
name = "quick-oxibooks"
version = "0.2.4"
edition = "2021"
authors = ["@exotik850"]
license = "MIT"
description = "A Rust client library for QuickBooks Online API"
repository = "https://github.com/exotik850/quick-oxibooks"
keywords = ["quickbooks", "quickbooks-online", "api", "client", "rust"]
categories = ["api-bindings", "web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = { version = "0.4", optional = true }
thiserror = "2.0"
base64 = "0.22"
ureq = { version = "3.3", features = ["json"] }
quickbooks-xsd = { version = "3.75", path = "../quickbooks-xsd" }

# Macros
paste = { package = "pastey", version = "0.2" }
urlencoding = "2.1"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }

[dev-dependencies]
env_logger = "0.11"

[features]
macros = []
attachments = []
pdf = []
# polars = ["quickbooks-types/polars"]
logging = ["dep:log"]
# builder = ["quickbooks-types/builder"]

[[example]]
name = "invoice_query"
path = "examples/invoice_query.rs"

[[example]]
name = "report_query"
path = "examples/report_query.rs"
